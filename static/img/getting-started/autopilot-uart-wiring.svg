<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Camera gimbal to flight controller UART wiring</title>
  <desc id="desc">Connect camera gimbal TX to flight controller RX, camera gimbal RX to flight controller TX, and ground to ground.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#22699c"/></marker>
    <style>text { font-family: Arial, sans-serif; fill: #17324d; } .label { font-size: 24px; font-weight: 700; } .pin { font-size: 21px; font-weight: 600; } .note { font-size: 18px; fill: #5d7182; }</style>
  </defs>
  <rect width="1200" height="520" fill="#f4f9fc"/>
  <rect x="70" y="85" width="340" height="335" rx="20" fill="#ffffff" stroke="#22699c" stroke-width="3"/>
  <text x="240" y="140" text-anchor="middle" class="label">Camera Gimbal UART</text>
  <rect x="130" y="190" width="220" height="55" rx="10" fill="#e8f1f8"/><text x="155" y="225" class="pin">Camera Gimbal TX</text>
  <rect x="130" y="270" width="220" height="55" rx="10" fill="#e8f1f8"/><text x="155" y="305" class="pin">Camera Gimbal RX</text>
  <rect x="130" y="350" width="220" height="55" rx="10" fill="#e8f1f8"/><text x="155" y="385" class="pin">Camera Gimbal GND</text>
  <rect x="790" y="85" width="340" height="335" rx="20" fill="#ffffff" stroke="#22699c" stroke-width="3"/>
  <text x="960" y="140" text-anchor="middle" class="label">Flight Controller UART</text>
  <rect x="850" y="190" width="220" height="55" rx="10" fill="#e8f1f8"/><text x="875" y="225" class="pin">Flight Controller RX</text>
  <rect x="850" y="270" width="220" height="55" rx="10" fill="#e8f1f8"/><text x="875" y="305" class="pin">Flight Controller TX</text>
  <rect x="850" y="350" width="220" height="55" rx="10" fill="#e8f1f8"/><text x="875" y="385" class="pin">Flight Controller GND</text>
  <path d="M350 217 C520 217 680 297 850 297" fill="none" stroke="#22699c" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M350 297 C520 297 680 217 850 217" fill="none" stroke="#22699c" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M350 377 L850 377" fill="none" stroke="#497a58" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="600" y="475" text-anchor="middle" class="note">Cross TX/RX; connect GND to GND. Confirm UART voltage and baud rate for both devices.</text>
</svg>
