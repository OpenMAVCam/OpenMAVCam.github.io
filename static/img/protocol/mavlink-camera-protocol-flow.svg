<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">OpenMAVCam MAVLink Camera Protocol v2 flow</title><desc id="desc">QGroundControl discovers the camera, MavClient and MAVSDK CameraServer route commands to CameraLocalClient, and camera information, stream information, acknowledgements, and status return. RTSP carries the video separately.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#176b9c"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#398564"/></marker><style>text{font-family:Arial,sans-serif;fill:#16334c}.t{font-size:27px;font-weight:700}.b{font-size:20px}.s{font-size:17px;fill:#587083}.l{font-size:17px;font-weight:700;fill:#176b9c}.gr{font-size:17px;font-weight:700;fill:#398564}</style></defs>
  <rect width="1440" height="620" fill="#f4f9fc"/><text x="720" y="55" text-anchor="middle" class="t">OpenMAVCam MAVLink Camera Protocol v2</text>
  <rect x="70" y="190" width="270" height="160" rx="20" fill="#fff" stroke="#176b9c" stroke-width="3"/><text x="205" y="243" text-anchor="middle" class="t">QGroundControl</text><text x="205" y="282" text-anchor="middle" class="b">Discovery · control · UI</text><text x="205" y="317" text-anchor="middle" class="s">MAV_CMD_REQUEST_MESSAGE</text>
  <path d="M340 245 H470" fill="none" stroke="#176b9c" stroke-width="5" marker-end="url(#a)"/><path d="M470 300 H340" fill="none" stroke="#176b9c" stroke-width="5" marker-end="url(#a)"/><text x="405" y="215" text-anchor="middle" class="l">MAVLink</text>
  <rect x="480" y="145" width="365" height="250" rx="22" fill="#fff" stroke="#176b9c" stroke-width="4"/><text x="662" y="198" text-anchor="middle" class="t">MavClient · MAVSDK</text><text x="662" y="238" text-anchor="middle" class="b">CameraServer · ParamServer</text><text x="662" y="273" text-anchor="middle" class="b">TrackingServer · FtpServer</text><text x="662" y="333" text-anchor="middle" class="s">Information · commands · ACK · status</text>
  <path d="M845 270 H940" fill="none" stroke="#176b9c" stroke-width="5" marker-end="url(#a)"/><rect x="950" y="145" width="420" height="250" rx="22" fill="#fff" stroke="#176b9c" stroke-width="4"/><text x="1160" y="198" text-anchor="middle" class="t">CameraLocalClient</text><text x="1160" y="238" text-anchor="middle" class="b">Camera · IR · AI · storage</text><text x="1160" y="273" text-anchor="middle" class="b">settings · capture · stream</text><text x="1160" y="333" text-anchor="middle" class="s">Hardware-specific implementation</text>
  <path d="M950 365 C820 490 575 490 430 350" fill="none" stroke="#176b9c" stroke-width="4" marker-end="url(#a)"/><text x="692" y="515" text-anchor="middle" class="l">CAMERA_INFORMATION · VIDEO_STREAM_INFORMATION · STORAGE_INFORMATION · CAMERA_CAPTURE_STATUS</text>
  <path d="M1160 395 C1190 480 1285 480 1325 395" fill="none" stroke="#398564" stroke-width="5" marker-end="url(#g)"/><text x="1260" y="492" text-anchor="middle" class="gr">RTSP video: H.264 / H.265</text><text x="720" y="577" text-anchor="middle" class="s">MAVLink publishes capability and stream metadata; video frames use the direct RTSP transport.</text>
</svg>
